[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "literature-search-agent"
version = "0.3.0"
description = "Phases A+B+C: clarification, auditable terms, and provider query plans"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.6,<4.10",
  "fastapi>=0.115,<0.120",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
literature-clarifier = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
